<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="50%" stop-color="#6c3483"/>
      <stop offset="100%" stop-color="#4a235a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base shadow -->
  <ellipse cx="32" cy="58" rx="12" ry="4" fill="rgba(0,0,0,0.3)"/>
  <!-- Monolith body - tall crystal obelisk -->
  <polygon points="32,4 42,20 40,54 24,54 22,20" fill="url(#mg)" stroke="#2c0a3e" stroke-width="1.5"/>
  <!-- Inner glow line -->
  <line x1="32" y1="8" x2="32" y2="50" stroke="#d7bde2" stroke-width="1.5" opacity="0.6"/>
  <!-- Top crystal facet -->
  <polygon points="32,4 38,16 32,12 26,16" fill="#bb8fce" opacity="0.7"/>
  <!-- Energy glow at center -->
  <circle cx="32" cy="30" r="4" fill="#e8daef" opacity="0.5" filter="url(#glow)"/>
  <!-- Rune marks -->
  <rect x="29" y="22" width="6" height="1.5" rx="0.5" fill="#d2b4de" opacity="0.4"/>
  <rect x="29" y="36" width="6" height="1.5" rx="0.5" fill="#d2b4de" opacity="0.4"/>
</svg>
