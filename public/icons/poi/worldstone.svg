<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="50%" stop-color="#2e86c1"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#2e86c1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="20" fill="#85c1e9" opacity="0.15" filter="url(#glow2)"/>
  <!-- Diamond shape - worldstone crystal -->
  <polygon points="32,6 54,32 32,58 10,32" fill="url(#wg)" stroke="#1b4f72" stroke-width="1.5"/>
  <!-- Inner diamond -->
  <polygon points="32,14 46,32 32,50 18,32" fill="#2980b9" opacity="0.6"/>
  <!-- Core glow -->
  <circle cx="32" cy="32" r="10" fill="url(#core)" filter="url(#glow2)"/>
  <!-- Cross pattern - teleport symbol -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#d6eaf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="32" x2="44" y2="32" stroke="#d6eaf8" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner sparkles -->
  <circle cx="32" cy="10" r="2" fill="#ebf5fb" opacity="0.8"/>
  <circle cx="32" cy="54" r="2" fill="#ebf5fb" opacity="0.5"/>
  <circle cx="14" cy="32" r="2" fill="#ebf5fb" opacity="0.5"/>
  <circle cx="50" cy="32" r="2" fill="#ebf5fb" opacity="0.5"/>
</svg>
